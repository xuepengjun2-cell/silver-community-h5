name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Check identity and account review boundaries
        run: npm run test:identity
      - name: Check media and anonymous album sharing
        run: npm run test:media
      - name: Check account and upload concurrency
        run: npm run test:concurrency
      - name: Check existing SSO
        run: npm run test:sso
